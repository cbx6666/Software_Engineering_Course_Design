spring:
  application:
    name: back-end
  mvc:
    async:
      request-timeout: 600000
  servlet:
    multipart:
      max-file-size: 30MB
      max-request-size: 30MB

  # ===== MySQL =====
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://139.196.151.22:3306/glassdetect}
    username: ${SPRING_DATASOURCE_USERNAME:remote_user}
    password: ${SPRING_DATASOURCE_PASSWORD:Software007@}

server:
  port: ${SERVER_PORT:9000}
  tomcat:
    connection-timeout: 600000

# 前端地址
frontend:
  url: ${FRONTEND_URL:http://localhost:3000}

# 算法服务地址
algorithm:
  url: ${ALGORITHM_URL:http://127.0.0.1:8000}

# 图片存储路径
image:
  storage:
    path: ${IMAGE_STORAGE_PATH:./runtime/images}

result:
  storage:
    path: ${RESULT_STORAGE_PATH:./runtime/results}

app:
  persistence:
    enabled: ${APP_PERSISTENCE_ENABLED:false}

mybatis-plus:
  # Mapper XML 位置（可选，BaseMapper 不需要，但你后续写自定义 SQL 会用到）
  mapper-locations: classpath*:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
