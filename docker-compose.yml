services:
  algorithm:
    build: ./Algorithm
    container_name: glass-algorithm
    environment:
      - FLATNESS_RESULT_PATH=/data/result
    volumes:
      - /data/result:/data/result
    restart: unless-stopped

  backend:
    build: ./back-end
    container_name: glass-backend
    hostname: glass-backend
    extra_hosts:
      - "glass-backend:127.0.0.1"
    ports:
      - "18003:9000"
    environment:
      - FRONTEND_URL=http://8.159.143.133
      - ALGORITHM_URL=http://algorithm:8000
      - IMAGE_STORAGE_PATH=/data/images
      - RESULT_STORAGE_PATH=/data/result
      - APP_DATABASE_ENABLED=false
      - APP_PERSISTENCE_ENABLED=false
      - SPRING_DATASOURCE_URL=jdbc:mysql://139.196.151.22:3306/glassdetect?connectTimeout=5000&socketTimeout=30000&useUnicode=true&characterEncoding=utf8
      - SPRING_DATASOURCE_USERNAME=remote_user
      - SPRING_DATASOURCE_PASSWORD=Software007@
    volumes:
      - /data/images:/data/images
      - /data/result:/data/result
    depends_on:
      - algorithm
    restart: unless-stopped
